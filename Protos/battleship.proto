syntax = "proto3";

option csharp_namespace = "BattleShip.Grpc";

package battleship;

// Fire est la seule operation dont le refus est une regle du jeu : c'est ce qui
// rend l'erreur attendue demontrable, donc ce qui justifie le contrat binaire
// ici plutot qu'ailleurs. Le message ne porte pas la vue : le front la relit en
// HTTP, soit un aller-retour de plus que POST /shots. Assume, voir ADR 0005.
service Battle {
  rpc Fire (FireCommand) returns (ShotOutcome);
}

message FireCommand {
  string game_id = 1;
  int32 column = 2;
  int32 row = 3;
}

message ShotOutcome {
  int32 column = 1;
  int32 row = 2;
  string result = 3;
  bool game_over = 4;
  string winner = 5;
}
